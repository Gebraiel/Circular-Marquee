<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
       body{
            font-family: "Poppins";
            min-height: 100vh;
            overflow: hidden;
        }
        .marquee{
            width:100%;

            aspect-ratio: 1;
            align-items: center;
            justify-content: center;
            display: flex;
            gap:12px;
            position: relative;
            
        }
        .circle{
            width: 100%;
            min-height: 1px;
            position: absolute;
            top:120%;
            left:0;
            animation: move 10s linear infinite ;
        }
        .half-circle{
            /* content:""; */
            display: block;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            background: linear-gradient(0deg,rgba(255,255,255,0.5),transparent 10%) ;
            
        }

        .track{
            display: flex;
            justify-content: center;
            align-items: center;
            gap:12px;
            animation:marquee 10s infinite linear;
        }
        /* .track:nth-child(1){
            background-color: blue;
        }
        .track:nth-child(2){
            background-color: yellow;
        } */
        @keyframes move{
            0%{
                transform: rotate(0);
            }
            100%{
                transform: rotate(180deg);
            }
        }
        .item {
            position: absolute;
            offset-path: circle(1200px at center );
            /* offset-rotate: 0deg; */
            max-width:200px;
            aspect-ratio: 1;
            offset-distance: calc(var(--i) * 100% / 18);
            /* animation: spin 6s linear infinite; */
            offset-rotate: auto;
        }
        @media(max-width:991px){
            .item{
                offset-path:circle(600px at center);
                width:100px;
            }
            .circle{
                top:100%;
         
            }
        }
    </style>
</head>
<body class="flex justify-center items-center h-screen overflow-hidden">
     <div class="marquee">
